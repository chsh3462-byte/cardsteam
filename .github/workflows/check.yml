name: Game checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-rewards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
